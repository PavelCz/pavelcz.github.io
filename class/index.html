<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Class Materials</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #0f1419;
      --bg-secondary: #1a2027;
      --bg-card: #232b35;
      --accent: #f0a500;
      --accent-soft: rgba(240, 165, 0, 0.15);
      --text-primary: #e8e6e3;
      --text-secondary: #9ca3af;
      --border: #2d3748;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Source Serif 4', Georgia, serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.7;
      min-height: 100vh;
    }

    /* Subtle grid background */
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: 
        linear-gradient(rgba(240, 165, 0, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(240, 165, 0, 0.03) 1px, transparent 1px);
      background-size: 50px 50px;
      pointer-events: none;
      z-index: -1;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 3rem 1.5rem;
    }

    header {
      margin-bottom: 3rem;
      padding-bottom: 2rem;
      border-bottom: 1px solid var(--border);
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 0.9rem;
      margin-bottom: 1.5rem;
      transition: color 0.2s;
    }

    .back-link:hover {
      color: var(--accent);
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      margin-bottom: 0.5rem;
    }

    .subtitle {
      color: var(--text-secondary);
      font-size: 1.1rem;
    }

    section {
      margin-bottom: 3rem;
    }

    .section-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: var(--accent);
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .section-label::after {
      content: '';
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, var(--border), transparent);
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      transition: border-color 0.3s, box-shadow 0.3s;
    }

    .card:hover {
      border-color: var(--accent);
      box-shadow: 0 0 30px rgba(240, 165, 0, 0.1);
    }

    .video-wrapper {
      position: relative;
      padding-bottom: 56.25%;
      height: 0;
      background: var(--bg-secondary);
    }

    .video-wrapper iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    .pdf-wrapper {
      background: var(--bg-secondary);
      min-height: 700px;
    }

    .pdf-wrapper embed {
      width: 100%;
      height: 700px;
      display: block;
    }

    .card-footer {
      padding: 1rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid var(--border);
    }

    .card-title {
      font-weight: 600;
      font-size: 1rem;
    }

    .download-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.6rem 1.2rem;
      background: var(--accent-soft);
      color: var(--accent);
      text-decoration: none;
      border-radius: 6px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem;
      transition: background 0.2s, transform 0.2s;
    }

    .download-btn:hover {
      background: var(--accent);
      color: var(--bg-primary);
      transform: translateY(-1px);
    }

    footer {
      margin-top: 4rem;
      padding-top: 2rem;
      border-top: 1px solid var(--border);
      text-align: center;
      color: var(--text-secondary);
      font-size: 0.9rem;
    }

    footer a {
      color: var(--accent);
      text-decoration: none;
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 1.8rem;
      }
      
      .container {
        padding: 2rem 1rem;
      }

      .pdf-wrapper, .pdf-wrapper embed {
        height: 500px;
        min-height: 500px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <a href="/" class="back-link">← Back to main site</a>
      <h1>Pigeonhole Principle</h1>
      <p class="subtitle">Lecture materials and resources</p>
    </header>

    <section>
      <div class="section-label">Video Lecture</div>
      <div class="card">
        <div class="video-wrapper">
          <iframe 
            src="https://drive.google.com/file/d/1KwsoDYMbZOBqmsKkQ-n_VKY9OEgLNCDL/preview" 
            allow="autoplay"
            allowfullscreen>
          </iframe>
        </div>
      </div>
    </section>

    <section>
      <div class="section-label">Lecture Notes</div>
      <div class="card">
        <div class="pdf-wrapper">
          <embed src="pigeonhole-principle-lecture.pdf" type="application/pdf" />
        </div>
        <div class="card-footer">
          <span class="card-title">pigeonhole-principle-lecture.pdf</span>
          <a href="pigeonhole-principle-lecture.pdf" download class="download-btn">
            ↓ Download
          </a>
        </div>
      </div>
    </section>

    <footer>
      <a href="/">Pavel Czempin</a> · USC
    </footer>
  </div>
</body>
</html>
